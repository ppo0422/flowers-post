<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowers 발음 듣기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Noto+Sans:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #F6F7F0; --card: #FFFFFF; --line: #DCE3D3; --ink: #23401C; --muted: #56664F;
  --ipa: #A8264F; --accent: #2F6B2A; --accent-ink: #FFFFFF; --playing: #FCE9EF; --playing-line: #D9577F;
  --display: "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --ipa-font: "Noto Sans", "Lucida Sans Unicode", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ko); }
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(44px, 9vw, 72px); line-height: 1; }
.sub { margin: 4px 0 0; font-size: 17px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--card); }
.seg button { font: 500 15px var(--ko); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.all { display: inline-flex; align-items: center; gap: 8px; font: 700 15px var(--ko); color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px; padding: 10px 18px; min-height: 46px; cursor: pointer; }
.all svg { width: 18px; height: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
@media (max-width: 460px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .card { padding: 14px 12px 12px; } .word { font-size: 20px; } }
.card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-width: 0; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 16px 14px; cursor: pointer; font: inherit; }
.card:active { transform: scale(.98); }
.card.playing { background: var(--playing); border-color: var(--playing-line); }
.num { font-size: 13px; color: var(--muted); }
.word { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.ipa { font-family: var(--ipa-font); font-weight: 500; font-size: 16px; color: var(--ipa); }
.ko { font-size: 15px; color: var(--muted); }
.spk { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; color: var(--muted); }
.card.playing .spk { color: var(--playing-line); }
:focus-visible { outline: 3px solid var(--playing-line); outline-offset: 2px; }
.note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { .card:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 lang="en">Flowers</h1>
    <p class="sub">카드를 누르면 영어 발음이 나와요.</p>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="빠르기">
      <button type="button" data-rate="0.7" aria-pressed="false">천천히</button>
      <button type="button" data-rate="1" aria-pressed="true">보통</button>
    </div>
    <button type="button" class="all" id="play-all">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <span>모두 듣기</span>
    </button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">소리가 안 나면 기기의 무음 모드와 음량을 확인해 주세요.</p>
</div>

const SPK = '<svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const grid = document.getElementById("grid");
const allBtn = document.getElementById("play-all");
const player = new Audio();
player.preservesPitch = true;
let rate = 1, token = 0, current = -1;

FLOWERS.forEach((f, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "card"; b.id = "card-" + i;
  b.setAttribute("aria-label", f.w + " 듣기, " + f.ko);
  b.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="word" lang="en">' + f.w + '</span><span class="ipa">' + f.ipa + '</span><span class="ko">' + f.ko + '</span>' + SPK;
  b.addEventListener("click", () => { stopAll(); play(i); });
  grid.appendChild(b);
});

function mark(i, on) { const el = document.getElementById("card-" + i); if (el) el.classList.toggle("playing", on); }

function play(i, onDone) {
  if (current >= 0) mark(current, false);
  current = i;
  player.onended = () => { mark(i, false); current = -1; if (onDone) onDone(); };
  player.onerror = player.onended;
  player.src = FLOWERS[i].a;
  player.playbackRate = rate;
  mark(i, true);
  const p = player.play();
  if (p && p.catch) p.catch(() => mark(i, false));
}

function setAll(on) {
  allBtn.querySelector("span").textContent = on ? "멈추기" : "모두 듣기";
  allBtn.querySelector("svg").innerHTML = on
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M7 4.5v15l13-7.5z"/>';
}

function stopAll() {
  token++; player.pause(); player.onended = null;
  if (current >= 0) mark(current, false);
  current = -1; setAll(false);
}

allBtn.addEventListener("click", () => {
  if (allBtn.querySelector("span").textContent === "멈추기") { stopAll(); return; }
  stopAll();
  const t = token; setAll(true);
  const next = (i) => {
    if (t !== token) return;
    if (i >= FLOWERS.length) { setAll(false); return; }
    play(i, () => setTimeout(() => next(i + 1), 800));
  };
  next(0);
});

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  rate = parseFloat(b.dataset.rate);
  player.playbackRate = rate;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
}));
</script>
